                            <div>
                              <span className="text-slate-500 block text-[10px] uppercase">Monthly</span>
                              <span className="font-bold text-emerald-400">{formatMoney(loan.monthly_repayment)}</span>
                            </div>
                            <div>
                              <span className="text-slate-500 block text-[10px] uppercase">Remaining</span>
                              <span className="font-bold text-rose-400">{formatMoney(getRemaining(loan))}</span>
                            </div>
                            <div>
                              <span className="text-slate-500 block text-[10px] uppercase">Next Repayment</span>
                              <span className={`font-bold ${loan.status === 'FULLY_PAID' ? 'text-emerald-400' : loan.status === 'APPROVED' ? 'text-amber-300' : 'text-slate-400'}`}>
                                {nextRepay}
                              </span>
                            </div>
                          </div>
                        </div>
                      </button>

                      {/* ===== EXPANDED DETAILS (only when opened) ===== */}
                      {isExpanded && (
                        <div className="px-4 sm:px-5 pb-5 space-y-4 border-t border-slate-800/60 pt-4">

                          {/* Terms breakdown */}
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs bg-slate-950/40 p-3 rounded-xl border border-slate-800">
                            <div>
                              <span className="text-slate-500 block">Principal</span>
                              <span className="font-bold text-slate-200">{formatMoney(loan.principal_amount)}</span>
                            </div>
                            <div>
                              <span className="text-slate-500 block">Tenure</span>
                              <span className="font-bold text-slate-200">{loan.tenure_months} Months</span>
                            </div>
                            <div>
                              <span className="text-slate-500 block">Monthly Repay</span>
                              <span className="font-bold text-emerald-400">{formatMoney(loan.monthly_repayment)}</span>
                            </div>
                            <div>
                              <span className="text-slate-500 block">Total Due</span>
                              <span className="font-bold text-amber-300">{formatMoney(getTotalDue(loan))}</span>
                            </div>
                          </div>

                          {/* Guarantor Status List */}
                          <div className="text-xs space-y-1">
                            <span className="text-slate-400 font-semibold block">Nominated Guarantors:</span>
                            <div className="flex flex-wrap gap-2">
                              {(loan.guarantors || []).map((g, idx) => (
                                <span key={idx} className={`px-2.5 py-1 rounded-md border text-[11px] flex items-center gap-1 ${
                                  g.status === 'ACCEPTED' 
                                    ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' 
                                    : 'bg-slate-800 border-slate-700 text-slate-400'
                                }`}>
                                  <i className={`fas ${g.status === 'ACCEPTED' ? 'fa-check text-emerald-400' : 'fa-clock text-amber-400'}`}></i>
                                  <span>{g.name} ({g.status})</span>
                                </span>
                              ))}
                            </div>
                          </div>

                          {/* ===== REPAYMENT PROGRESS & HISTORY (for APPROVED / FULLY_PAID loans) ===== */}
                          {(loan.status === 'APPROVED' || loan.status === 'FULLY_PAID') && (
                            <div className="space-y-3 pt-2 border-t border-slate-800">
                              {/* Progress summary */}
                              <div className="bg-slate-950/50 rounded-xl p-3 border border-slate-800 space-y-2">
                                <div className="flex items-center justify-between text-xs">
                                  <span className="text-slate-400 font-semibold">Repayment Progress</span>
                                  <span className={`font-bold ${loan.status === 'FULLY_PAID' ? 'text-emerald-400' : 'text-amber-300'}`}>
                                    {loan.status === 'FULLY_PAID' ? 'FULLY PAID' : 'IN PROGRESS'}
                                  </span>
                                </div>
                                <div className="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                                  <div
                                    className={`h-full rounded-full transition-all ${loan.status === 'FULLY_PAID' ? 'bg-emerald-500' : 'bg-indigo-500'}`}
                                    style={{ width: `${Math.min(100, (getTotalRepaid(loan) / getTotalDue(loan)) * 100)}%` }}
                                  ></div>
                                </div>
                                <div className="grid grid-cols-3 gap-2 text-xs">
                                  <div>
                                    <span className="text-slate-500 block">Total Repaid</span>
                                    <span className="font-bold text-emerald-400">{formatMoney(getTotalRepaid(loan))}</span>
                                  </div>
                                  <div>
                                    <span className="text-slate-500 block">Remaining</span>
                                    <span className="font-bold text-rose-400">{formatMoney(getRemaining(loan))}</span>
                                  </div>
                                  <div>
                                    <span className="text-slate-500 block">Installments</span>
                                    <span className="font-bold text-slate-200">

                                </div>
                                {(loan.repayments && loan.repayments.length > 0) ? (

                                          <th className="py-2 px-3 font-semibold">Ref</th>

                                          <th className="py-2 px-3 font-semibold">Recorded By</th>
                                          <th className="py-2 px-3 font-semibold">Note</th>
                                        </tr>
                                      </thead>
                                      <tbody className="divide-y divide-slate-800 text-slate-300">
                                        {[...(loan.repayments || [])].reverse().map(r => (
                                          <tr key={r.id} className="hover:bg-slate-800/40">
                                            <td className="py-2 px-3 font-mono">{r.date}</td>

                                  </div>
                                )}
                              </div>

                              {/* Admin / Clerk: Record repayment form */}

                <div className="flex items-center justify-between pt-2 text-xs text-slate-400">
                  <span>
                    {filteredLoans.length} loan{filteredLoans.length === 1 ? '' : 's'}
                    {filteredLoans.length > PAGE_SIZE ? ` · Page ${safePage + 1} of ${loanTotalPages}` : ''}
                  </span>
                  {loanTotalPages > 1 && (
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        disabled={safePage === 0}
                        onClick={() => setLoanPage(p => Math.max(0, p - 1))}
                        className="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 disabled:opacity-40 hover:bg-slate-800"
                      >
                        Prev
                      </button>
                      <button
                        type="button"
                        disabled={safePage >= loanTotalPages - 1}
                        onClick={() => setLoanPage(p => Math.min(loanTotalPages - 1, p + 1))}
                        className="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 disabled:opacity-40 hover:bg-slate-800"
                      >
                        Next
                      </button>
                    </div>
                  )}
                </div>
                    </>
                  );
                })()}
              </div>

            </div>

          </div>

        </div>
      );
    }

    function ReportsView({ members, savings, loans, auditLogs, handleImportBackup, coopName, onSaveCoopName }) {
      const [editName, setEditName] = useState(coopName || '');

      // Keep local input in sync when Firebase updates the name
      useEffect(() => {
        setEditName(coopName || '');
      }, [coopName]);

      const handleExportFullSystemBackup = async () => {
        try {
          const allSavings = await loadSavingsForMember('ALL');
          const allLoans = await loadAllLoans();
          const fullData = {
            export_date: new Date().toISOString(),
            system: (coopName || 'Cooperative') + ' Management System',
            dataVersion: 2,
            members,
            savings: allSavings,
            loans: allLoans,
            auditLogs
          };
          downloadJSON(`Coop_Full_Database_Backup_${new Date().toISOString().substring(0,10)}.json`, fullData);
        } catch (e) {
          console.error(e);
        }
      };

      const handleExportAuditLogsCSV = () => {
        const headers = ["Log ID", "Timestamp", "User", "Action", "Details"];
        const rows = auditLogs.map(l => [l.id, l.timestamp, l.user, l.action, l.details]);
        downloadCSV(`Audit_Trail_Report_${new Date().toISOString().substring(0,10)}.csv`, headers, rows);
      };

      const handleSubmitName = (e) => {
        e.preventDefault();
        if (onSaveCoopName) onSaveCoopName(editName);
      };

      return (
        <div className="space-y-8">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-2xl font-bold text-white">Reports & System Settings</h2>
              <p className="text-xs text-slate-400 mt-0.5">Change cooperative name, download backups, or export audit logs</p>
            </div>
          </div>

          {/* Cooperative Name Settings */}
          <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-xl">
                <i className="fas fa-building-columns"></i>
              </div>
              <div>
                <h3 className="text-lg font-bold text-white">Cooperative Name & Branding</h3>
                <p className="text-xs text-slate-400">This name appears on the login page, header, footer, and statements</p>
              </div>
            </div>

            <form onSubmit={handleSubmitName} className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
              <div className="flex-1">
                <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Display Name</label>
                <input
                  type="text"
                  value={editName}
                  onChange={e => setEditName(e.target.value)}
                  placeholder="e.g. FGGCEFON Cooperative"
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  required
                />
              </div>
              <button
                type="submit"
                className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2"
              >
                <i className="fas fa-save"></i>
                <span>Save Name</span>
              </button>
            </form>
            <p className="text-[11px] text-slate-500">
              Current live name: <span className="text-indigo-300 font-semibold">{coopName}</span>
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            {/* Backup Box */}
            <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
              <div className="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl">
                <i className="fas fa-database"></i>
              </div>
              <h3 className="text-lg font-bold text-white">Full System Database Snapshot</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Download an entire JSON dump containing member tables, financial ledgers, active loans, and security audit logs.
              </p>

              <div className="pt-2 flex flex-wrap items-center gap-3">
                <button
                  onClick={handleExportFullSystemBackup}
                  className="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center gap-2"
                >
                  <i className="fas fa-download"></i>
                  <span>Export JSON Backup</span>
                </button>

                <label className="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold text-sm cursor-pointer transition-all flex items-center gap-2">
                  <i className="fas fa-upload text-emerald-400"></i>
                  <span>Restore JSON File</span>
                  <input type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                </label>
              </div>
            </div>

            {/* Audit Log Box */}
            <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
              <div className="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl">
                <i className="fas fa-shield-halved"></i>
              </div>
              <h3 className="text-lg font-bold text-white">Compliance Audit Trail CSV</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Export immutable logs for financial auditors. Tracks logins, ledger entries, and admin loan approvals.
              </p>

              <div className="pt-2">
                <button
                  onClick={handleExportAuditLogsCSV}
                  className="px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm transition-all shadow-lg shadow-emerald-600/30 flex items-center gap-2"
                >
                  <i className="fas fa-file-csv"></i>
                  <span>Download Audit Log CSV</span>
                </button>
              </div>
            </div>

          </div>

        </div>
      );
    }

    function StatementModal({ member, loans, onClose, coopName }) {
      const [savings, setSavings] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          setLoading(true);
          try {
            const rows = await loadSavingsForMember(member.id);
            if (!cancelled) setSavings(rows);
          } catch (e) {
            console.error(e);
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, [member.id]);

      const handlePrint = () => {
        window.print();
      };

      const handleDownloadStatementCSV = () => {
        const headers = ["Tx ID", "Date", "Type", "Amount (₦)", "Reference"];
        const rows = savings.map(s => [s.id, s.date, s.transaction_type, s.amount, s.reference_no]);
        downloadCSV(`${member.full_name.replace(/\s+/g, '_')}_Account_Statement.csv`, headers, rows);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-8 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
            
            {/* Printable Area Target */}
            <div id="printable-area" className="bg-white text-slate-900 p-8 rounded-2xl space-y-6">
              
              <div className="flex items-center justify-between border-b pb-4">
                <div>
                  <h1 className="text-2xl font-bold text-slate-900">{coopName || 'Cooperative'} Statement</h1>
                  <p className="text-xs text-slate-500">Official Member Passbook & Ledger Record</p>
                </div>
                <div className="text-right">
                  <div className="font-bold text-indigo-600">{member.member_number}</div>
                  <div className="text-xs text-slate-400">{new Date().toISOString().substring(0,10)}</div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4 text-xs bg-slate-50 p-4 rounded-xl">
                <div>
                  <span className="text-slate-400 block font-semibold uppercase">Member Name</span>
                  <span className="font-bold text-slate-800 text-sm">{member.full_name}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-semibold uppercase">Email Contact</span>
                  <span className="font-bold text-slate-800 text-sm">{member.email}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-semibold uppercase">Current Savings Balance</span>
                  <span className="font-bold text-emerald-600 text-sm">{formatMoney(member.savings)}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-semibold uppercase">Membership Status</span>
                  <span className="font-bold text-slate-800 text-sm">{member.status}</span>
                </div>
              </div>

              <div>
                <h3 className="font-bold text-slate-800 text-sm mb-2">Savings History</h3>
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="border-b bg-slate-100 text-slate-600">
                      <th className="p-2">Date</th>
                      <th className="p-2">Type</th>
                      <th className="p-2">Ref</th>
                      <th className="p-2 text-right">Amount</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y text-slate-700">
                    {savings.map(s => (
                      <tr key={s.id}>
                        <td className="p-2">{s.date}</td>
                        <td className="p-2 font-bold">{s.transaction_type}</td>
                        <td className="p-2 font-mono text-slate-500">{s.reference_no}</td>
                        <td className="p-2 text-right font-semibold">{formatMoney(s.amount)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="text-[10px] text-slate-400 text-center border-t pt-4">
                Generated automatically by {(coopName || 'Cooperative') + ' Management System'}.
              </div>

            </div>

            {/* Modal Actions */}
            <div className="no-print flex items-center justify-between pt-4 border-t border-slate-800">
              <button
                onClick={onClose}
                className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium"
              >
                Close
              </button>

              <div className="flex items-center gap-3">
                <button
                  onClick={handleDownloadStatementCSV}
                  className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-medium flex items-center gap-2"
                >
                  <i className="fas fa-file-csv text-emerald-400"></i>
                  <span>Download CSV</span>
                </button>

                <button
                  onClick={handlePrint}
                  className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/30 flex items-center gap-2"
                >
                  <i className="fas fa-print"></i>
                  <span>Print / Save PDF</span>
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Register service worker for Chrome Install / offline shell -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
          console.log('SW registered', reg.scope);
        }).catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>

  <!-- Chrome / Edge install prompt UI -->
  <div id="pwa-install-bar" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] max-w-md w-[calc(100%-2rem)]">
    <div class="bg-indigo-600 text-white rounded-2xl shadow-2xl px-4 py-3 flex items-center gap-3 border border-indigo-400/40">
      <i class="fas fa-download text-lg"></i>
      <div class="flex-1 text-sm">
        <div class="font-semibold">Install Coop Manager</div>
        <div class="text-indigo-100 text-xs">Add to your device for quick access</div>
      </div>
      <button id="pwa-install-btn" type="button" class="px-3 py-1.5 rounded-xl bg-white text-indigo-700 text-xs font-bold hover:bg-indigo-50">Install</button>
      <button id="pwa-install-dismiss" type="button" class="p-1.5 text-indigo-200 hover:text-white" title="Dismiss"><i class="fas fa-xmark"></i></button>
    </div>
  </div>
  <script>
    (function () {
      var deferredPrompt = null;
      var bar = document.getElementById('pwa-install-bar');
      var btn = document.getElementById('pwa-install-btn');
      var dismiss = document.getElementById('pwa-install-dismiss');
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (bar && !sessionStorage.getItem('pwa_install_dismissed')) {
          bar.classList.remove('hidden');
        }
      });
      if (btn) {
        btn.addEventListener('click', function () {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function () {
            deferredPrompt = null;
            if (bar) bar.classList.add('hidden');
          });
        });
      }
      if (dismiss) {
        dismiss.addEventListener('click', function () {
          if (bar) bar.classList.add('hidden');
          try { sessionStorage.setItem('pwa_install_dismissed', '1'); } catch (err) {}
        });
      }
      window.addEventListener('appinstalled', function () {
        if (bar) bar.classList.add('hidden');
        deferredPrompt = null;
      });
    })();
  </script>
</body>
