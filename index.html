        maximumFractionDigits: 2
      });
    };

    // Generic CSV Download trigger
    const downloadCSV = (filename, headers, rows) => {
      const csvContent = [
        headers.join(','),
        ...rows.map(row => row.map(field => {
          const stringVal = field === null || field === undefined ? '' : String(field);
          // Escape quotes and wrap in quotes if comma present
          return `"${stringVal.replace(/"/g, '""')}"`;
        }).join(','))
      ].join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    };

    // JSON Backup Download trigger
    const downloadJSON = (filename, data) => {
      const jsonString = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    };

    const firebaseConfig = {

    firebase.initializeApp(firebaseConfig);

    // --- PHASE 1–3: Paginated data helpers ---
    const PAGE_SIZE = 25;

    /** Flatten nested savings/{userId}/{txId} → array */
    const flattenMemberSavings = (byMember) => {
      if (!byMember) return [];
      const out = [];
      Object.keys(byMember).forEach(uid => {
        const txs = byMember[uid];
        if (!txs || typeof txs !== 'object') return;
        // Legacy flat entry under savings root
        if (txs.transaction_type && txs.user_id) {
          out.push(txs);
          return;
        }
        Object.keys(txs).forEach(txId => {
          const t = txs[txId];
          if (t && typeof t === 'object') out.push({ ...t, id: t.id || txId, user_id: t.user_id || uid });
        });
      });
      return out;
    };

    /** Detect legacy savings array/object-of-rows vs nested-by-member */
    const isLegacySavingsShape = (data) => {
      if (!data) return false;
      if (Array.isArray(data)) return true;
      const first = data[Object.keys(data)[0]];
      return !!(first && first.transaction_type && first.user_id);
    };

    /** Detect legacy loans array vs object keyed by loan id */
    const isLegacyLoansShape = (data) => {
      if (!data) return false;
      if (Array.isArray(data)) return true;
      const first = data[Object.keys(data)[0]];
      // nested-by-id loan has principal_amount; array-like numeric keys also have it — check if key looks like loan id
      const keys = Object.keys(data);
      if (keys.length && keys.every(k => /^\d+$/.test(k))) return true;
      return false;
    };

    const normalizeLoan = (l, id) => ({
      ...l,
      id: l.id || id,
      repayments: Array.isArray(l.repayments)
        ? l.repayments
        : (l.repayments && typeof l.repayments === 'object' ? Object.values(l.repayments) : []),
      guarantors: Array.isArray(l.guarantors)
        ? l.guarantors
        : (l.guarantors && typeof l.guarantors === 'object' ? Object.values(l.guarantors) : [])
    });

    /** One-time migrate legacy arrays → nested paths */
    const migrateLegacyDataIfNeeded = async () => {
      try {
        const versionSnap = await db.ref('settings/dataVersion').once('value');
        if (versionSnap.val() >= 2) return;

        const savSnap = await db.ref('savings').once('value');
        const savData = savSnap.val();
        if (savData && isLegacySavingsShape(savData)) {
          const rows = Array.isArray(savData) ? savData : Object.values(savData);
          const nested = {};
          rows.forEach(r => {
            if (!r || !r.user_id) return;
            const txId = r.id || `sav-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            if (!nested[r.user_id]) nested[r.user_id] = {};
            nested[r.user_id][txId] = { ...r, id: txId };
          });
          await db.ref('savings').set(nested);
          console.log('Migrated savings to nested-by-member structure.', rows.length, 'rows');
        }

        const loanSnap = await db.ref('loans').once('value');
        const loanData = loanSnap.val();
        if (loanData && isLegacyLoansShape(loanData)) {
          const rows = Array.isArray(loanData) ? loanData : Object.values(loanData);
          const byId = {};
          rows.forEach(l => {
            if (!l) return;
            const id = l.id || `ln-${Date.now()}`;
            byId[id] = normalizeLoan(l, id);
          });
          await db.ref('loans').set(byId);
          console.log('Migrated loans to keyed-by-id structure.', rows.length, 'rows');
        }

        // Seed nested demo data if empty after migrate check
        const sav2 = await db.ref('savings').once('value');
        if (!sav2.exists() || !sav2.val()) {
          const nested = {};
          INITIAL_SAVINGS.forEach(r => {
            if (!nested[r.user_id]) nested[r.user_id] = {};
            nested[r.user_id][r.id] = r;
          });
          await db.ref('savings').set(nested);
        }
        const loan2 = await db.ref('loans').once('value');
        if (!loan2.exists() || !loan2.val()) {
          const byId = {};
          INITIAL_LOANS.forEach(l => { byId[l.id] = l; });
          await db.ref('loans').set(byId);
        }

        await db.ref('settings/dataVersion').set(2);
      } catch (err) {
        console.error('Migration error:', err);
      }
    };

    /** Load savings for one member (or all members if userId is null — capped for safety) */
    const loadSavingsForMember = async (userId) => {
      if (userId && userId !== 'ALL') {
        const snap = await db.ref(`savings/${userId}`).once('value');
        const data = snap.val() || {};
        return Object.keys(data).map(k => ({ ...data[k], id: data[k].id || k, user_id: data[k].user_id || userId }))
          .sort((a, b) => (b.date || '').localeCompare(a.date || '') || String(b.id).localeCompare(String(a.id)));
      }
      // ALL: load root once (nested) — OK for moderate size; UI will paginate
      const snap = await db.ref('savings').once('value');
      const flat = flattenMemberSavings(snap.val());
      return flat.sort((a, b) => (b.date || '').localeCompare(a.date || '') || String(b.id).localeCompare(String(a.id)));
    };

    /** Write a single savings transaction */
    const writeSavingsTx = async (record) => {
      const txId = record.id || db.ref('savings').push().key;
      const payload = { ...record, id: txId };
      await db.ref(`savings/${record.user_id}/${txId}`).set(payload);
      return payload;
    };

    /** Delete a single savings transaction (SUPER_ADMIN only — caller must enforce) */
    const deleteSavingsTx = async (record) => {
      if (!record || !record.user_id || !record.id) throw new Error('Invalid savings record');
      await db.ref(`savings/${record.user_id}/${record.id}`).remove();
      return true;
    };

    /** Load all loans as array (keyed object in DB) */
    const loadAllLoans = async () => {
      const snap = await db.ref('loans').once('value');
      const data = snap.val();
      if (!data) return [];
      if (Array.isArray(data)) return data.map((l, i) => normalizeLoan(l, l.id || String(i)));
      return Object.keys(data).map(k => normalizeLoan(data[k], k))
        .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    };

    /** Write / update a single loan */
    const writeLoan = async (loan) => {
      const id = loan.id || db.ref('loans').push().key;
      const payload = normalizeLoan({ ...loan, id }, id);
      // Store repayments as object by id for stable updates
      const repObj = {};
      (payload.repayments || []).forEach(r => {
        const rid = r.id || db.ref('loans').push().key;
        repObj[rid] = { ...r, id: rid };
      });
      const toSave = { ...payload, repayments: repObj };
      await db.ref(`loans/${id}`).set(toSave);
      return normalizeLoan(toSave, id);
    };

    const INITIAL_MEMBERS = [

      { id: 'usr-2', member_number: 'COP-2026-002', full_name: 'David Miller', username: 'clerk', password: 'clerk123', email: 'david@coop.org', phone: '+234 803 000 0184', role: 'CLERK', status: 'ACTIVE', savings: 8200, joined: '2024-03-10' },

    const INITIAL_AUDIT_LOGS = [
      { id: 'log-1', timestamp: '2026-09-01 09:30:12', user: 'Sarah Connor (Admin)', action: 'APPROVED_LOAN', details: 'Approved loan #ln-201 for Michael Scott (₦3,000)' },

    function App() {
      // System States - synced with Firebase Realtime Database
      const [members, setMembers] = useState([]);
      // savings/loans are no longer fully mirrored — views load pages; dashboard holds a small recent slice
      const [recentSavings, setRecentSavings] = useState([]);
      const [loans, setLoans] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [coopName, setCoopName] = useState('FGGCEFON Cooperative');
      const [dbReady, setDbReady] = useState(false);
      const [lastSavingsMsg, setLastSavingsMsg] = useState('Last update on savings is on —');

      // Build human-readable last savings update message (date as dd/mm/yy)
      const buildLastSavingsMsg = (rows) => {
        if (!rows || !rows.length) return 'Last update on savings is on —';
        const latest = rows[0];
        let ddmmyy = latest.date || '';
        // Convert YYYY-MM-DD → DD/MM/YY
        if (/^\d{4}-\d{2}-\d{2}/.test(ddmmyy)) {
          const [y, m, d] = ddmmyy.substring(0, 10).split('-');
          ddmmyy = `${d}/${m}/${y.slice(-2)}`;
        }
        return `Last update on savings is on ${ddmmyy}`;
      };

      // Track which collections have been loaded from Firebase (prevents overwrite on startup)
      const membersHydrated = React.useRef(false);
      const auditHydrated = React.useRef(false);
      const membersSkipWrite = React.useRef(true);
      const auditSkipWrite = React.useRef(true);

      // Persist position + session across refresh (sessionStorage)
      const SESSION_USER_KEY = 'coop_session_user_id';
      const SESSION_TAB_KEY = 'coop_session_tab';
      const VALID_TABS = ['dashboard', 'members', 'savings', 'loans', 'reports'];

      const readInitialTab = () => {
        try {
          const hash = (window.location.hash || '').replace(/^#/, '').trim();
          if (VALID_TABS.includes(hash)) return hash;
          const stored = sessionStorage.getItem(SESSION_TAB_KEY);
          if (VALID_TABS.includes(stored)) return stored;
        } catch (e) { /* ignore */ }
        return 'dashboard';
      };

      // Authentication State
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState(readInitialTab);
      const [toast, setToast] = useState(null);
      const [statementModalMember, setStatementModalMember] = useState(null);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const sessionRestored = React.useRef(false);
      // Avoid flashing login screen while we restore session after refresh
      const [sessionChecking, setSessionChecking] = useState(() => {
        try { return !!sessionStorage.getItem(SESSION_USER_KEY); } catch (e) { return false; }
      });

      // Keep URL hash + sessionStorage in sync with active tab
      const persistTab = (tab) => {
        try {
          sessionStorage.setItem(SESSION_TAB_KEY, tab);
        } catch (e) { /* ignore */ }
      };

      // In-app navigation so browser Back goes to previous tab (does not leave the app)
      const navigateTab = (tab, { replace = false } = {}) => {
        if (tab === activeTab && !replace) return;
        setActiveTab(tab);
        persistTab(tab);
        const state = { tab, app: 'coop' };
        if (replace) {
          window.history.replaceState(state, '', '#' + tab);
        } else {
          window.history.pushState(state, '', '#' + tab);
        }
      };

      // Handle browser Back / Forward
      useEffect(() => {
        // Seed initial history entry so first Back stays in-app when possible
        if (!window.history.state || !window.history.state.app) {
          window.history.replaceState({ tab: activeTab, app: 'coop' }, '', '#' + activeTab);
        }
        persistTab(activeTab);

        const onPopState = (e) => {
          // Close open modals first if any
          if (isProfileModalOpen) {
            setIsProfileModalOpen(false);
            // Re-push so user doesn't leave the app on this back press
            window.history.pushState({ tab: activeTab, app: 'coop' }, '', '#' + activeTab);
            return;
          }
          if (statementModalMember) {
            setStatementModalMember(null);
            window.history.pushState({ tab: activeTab, app: 'coop' }, '', '#' + activeTab);
            return;
          }

          if (e.state && e.state.app === 'coop' && e.state.tab) {
            setActiveTab(e.state.tab);
            persistTab(e.state.tab);
          } else {
            // No more in-app history — stay on dashboard instead of leaving
            setActiveTab('dashboard');
            persistTab('dashboard');
            window.history.pushState({ tab: 'dashboard', app: 'coop' }, '', '#dashboard');
          }
        };

        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, [activeTab, isProfileModalOpen, statementModalMember]);

      // Load & listen to Firebase Realtime Database (members/settings/audit live; savings/loans on demand)
      useEffect(() => {
        const membersRef = db.ref('members');
        const auditRef = db.ref('auditLogs');
        const settingsRef = db.ref('settings');

        (async () => {
          try {
            await migrateLegacyDataIfNeeded();
            const memSnap = await membersRef.once('value');
            if (!memSnap.exists() || !memSnap.val()) {
              await membersRef.set(INITIAL_MEMBERS);
              await auditRef.set(INITIAL_AUDIT_LOGS);
              await settingsRef.set({ coopName: 'FGGCEFON Cooperative', dataVersion: 2 });
              // Seed nested savings/loans
              const nested = {};
              INITIAL_SAVINGS.forEach(r => {
                if (!nested[r.user_id]) nested[r.user_id] = {};
                nested[r.user_id][r.id] = r;
              });
              await db.ref('savings').set(nested);
              const byId = {};
              INITIAL_LOANS.forEach(l => { byId[l.id] = l; });
              await db.ref('loans').set(byId);
            }
            // Dashboard: small recent savings slice + loans list (keyed, moderate size)
            const recent = await loadSavingsForMember('ALL');
            const recentSlice = recent.slice(0, 50);
            setRecentSavings(recentSlice);
            setLastSavingsMsg(buildLastSavingsMsg(recentSlice));
            const allLoans = await loadAllLoans();
            setLoans(allLoans);
          } catch (err) {
            console.error('Initial data load error:', err);
          }
        })();

        settingsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data && data.coopName) {
            setCoopName(data.coopName);
            document.title = data.coopName + ' — Management System';
          } else if (!data) {
            settingsRef.set({ coopName: 'FGGCEFON Cooperative', dataVersion: 2 });
          }
        });

        const onMembers = membersRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const arr = Array.isArray(data) ? data : Object.values(data);
            const migrated = arr.map(m => {
              const matchingInit = INITIAL_MEMBERS.find(i => i.id === m.id);
              return {
                ...m,
                username: m.username || (matchingInit ? matchingInit.username : (m.email ? m.email.split('@')[0] : 'user')),
                password: m.password || (matchingInit ? matchingInit.password : 'password123')
              };
            });
            setMembers(migrated);
          } else {
            setMembers([]);
          }
          membersHydrated.current = true;
          setDbReady(true);
        });

        const onAudit = auditRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setAuditLogs(Array.isArray(data) ? data : Object.values(data));
          } else {
            setAuditLogs([]);
          }
          auditHydrated.current = true;
        });

        return () => {
          membersRef.off('value', onMembers);
          auditRef.off('value', onAudit);
          settingsRef.off('value');
        };
      }, []);

      // Restore logged-in user + tab after refresh (once members are loaded)
      useEffect(() => {
        if (!membersHydrated.current) return;
        if (sessionRestored.current) {
          // Keep currentUser object in sync with latest members data (e.g. savings balance)
          if (currentUser) {
            const fresh = members.find(m => m.id === currentUser.id);
            if (fresh && (
              fresh.savings !== currentUser.savings ||
              fresh.full_name !== currentUser.full_name ||
              fresh.role !== currentUser.role ||
              fresh.username !== currentUser.username
            )) {
              setCurrentUser(fresh);
            }
          }
          return;
        }
        sessionRestored.current = true;
        try {
          const savedId = sessionStorage.getItem(SESSION_USER_KEY);
          if (savedId) {
            const user = members.find(m => m.id === savedId);
            if (user && user.status !== 'SUSPENDED' && user.status !== 'INACTIVE') {
              setCurrentUser(user);
              const tab = readInitialTab();
              // Role-guard restricted tabs
              let safeTab = tab;
              if (tab === 'members' && user.role === 'MEMBER') safeTab = 'dashboard';
              if (tab === 'reports' && user.role !== 'SUPER_ADMIN') safeTab = 'dashboard';
              setActiveTab(safeTab);
              persistTab(safeTab);
              window.history.replaceState({ tab: safeTab, app: 'coop' }, '', '#' + safeTab);
            } else {
              sessionStorage.removeItem(SESSION_USER_KEY);
            }
          }
        } catch (e) { /* ignore */ }
        setSessionChecking(false);
      }, [members, currentUser]);

      // Save cooperative name (SUPER_ADMIN only)
      const handleSaveCoopName = (newName) => {
        const trimmed = (newName || '').trim();
        if (!trimmed) {
          showToast('Cooperative name cannot be empty.', 'error');
          return;
        }
        db.ref('settings').update({ coopName: trimmed }).then(() => {
          setCoopName(trimmed);
          document.title = trimmed + ' — Management System';
          logAudit('SETTINGS_UPDATE', `Cooperative name changed to "${trimmed}"`);
          showToast('Cooperative name updated successfully!');
        }).catch(err => {
          console.error(err);
          showToast('Failed to save cooperative name.', 'error');
        });
      };

      // Refresh helpers for child views after writes
      const refreshRecentSavings = async () => {
        try {
          const recent = await loadSavingsForMember('ALL');
          const recentSlice = recent.slice(0, 50);
          setRecentSavings(recentSlice);
          setLastSavingsMsg(buildLastSavingsMsg(recentSlice));
        } catch (e) { console.error(e); }
      };

      const refreshLoans = async () => {
        try {
          setLoans(await loadAllLoans());
        } catch (e) { console.error(e); }
      };

      // Members still full-sync (small list ~500)
      useEffect(() => {
        if (!membersHydrated.current) return;
        if (membersSkipWrite.current) { membersSkipWrite.current = false; return; }
        db.ref('members').set(members).catch(err => console.error('Firebase members write error:', err));
      }, [members]);

      useEffect(() => {
        if (!auditHydrated.current) return;
        if (auditSkipWrite.current) { auditSkipWrite.current = false; return; }
        db.ref('auditLogs').set(auditLogs).catch(err => console.error('Firebase audit write error:', err));
      }, [auditLogs]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const logAudit = (action, details) => {
        const newLog = {
          id: `log-${Date.now()}`,
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
          user: currentUser ? `${currentUser.full_name} (${currentUser.role})` : 'System',
          action,
          details
        };
        setAuditLogs(prev => [newLog, ...prev]);
      };

      // Handler Login
      const handleLogin = (user) => {
        setCurrentUser(user);
        sessionRestored.current = true;
        try {
          sessionStorage.setItem(SESSION_USER_KEY, user.id);
        } catch (e) { /* ignore */ }
        setActiveTab('dashboard');
        persistTab('dashboard');
        window.history.replaceState({ tab: 'dashboard', app: 'coop' }, '', '#dashboard');
        showToast(`Welcome back, ${user.full_name}!`);
        logAudit('LOGIN', `User ${user.full_name} logged in.`);
      };

      // Handler Logout
      const handleLogout = () => {
        logAudit('LOGOUT', `User ${currentUser?.full_name} logged out.`);
        setCurrentUser(null);
        try {
          sessionStorage.removeItem(SESSION_USER_KEY);
          // Keep last tab so after re-login they can land nearby; optional clear:
          // sessionStorage.removeItem(SESSION_TAB_KEY);
        } catch (e) { /* ignore */ }
        showToast('Logged out successfully.');
      };

      // Full Backup Import — writes nested structure to Firebase
      const handleImportBackup = (event) => {
        const fileReader = new FileReader();
        if (event.target.files && event.target.files[0]) {
          fileReader.readAsText(event.target.files[0], "UTF-8");
          fileReader.onload = async (e) => {
            try {
              const data = JSON.parse(e.target.result);
              if (data.members && data.savings && data.loans) {
                setMembers(data.members);
                if (data.auditLogs) setAuditLogs(data.auditLogs);
                // Normalize savings to nested-by-member
                let nestedSav = data.savings;
                if (Array.isArray(data.savings) || isLegacySavingsShape(data.savings)) {
                  const rows = Array.isArray(data.savings) ? data.savings : Object.values(data.savings);
                  nestedSav = {};
                  rows.forEach(r => {
                    if (!r || !r.user_id) return;
                    const txId = r.id || `sav-${Date.now()}`;
                    if (!nestedSav[r.user_id]) nestedSav[r.user_id] = {};
                    nestedSav[r.user_id][txId] = { ...r, id: txId };
                  });
                }
                await db.ref('savings').set(nestedSav);
                // Normalize loans to keyed-by-id
                let byId = data.loans;
                if (Array.isArray(data.loans) || isLegacyLoansShape(data.loans)) {
                  const rows = Array.isArray(data.loans) ? data.loans : Object.values(data.loans);
                  byId = {};
                  rows.forEach(l => {
                    if (!l) return;
                    const id = l.id || `ln-${Date.now()}`;
                    byId[id] = normalizeLoan(l, id);
                  });
                }
                await db.ref('loans').set(byId);
                await db.ref('settings/dataVersion').set(2);
                const restoredRecent = flattenMemberSavings(nestedSav).slice(0, 50);
                setRecentSavings(restoredRecent);
                setLastSavingsMsg(buildLastSavingsMsg(restoredRecent));
                setLoans(Object.keys(byId).map(k => normalizeLoan(byId[k], k)));
                showToast('System database restored successfully!');
                logAudit('DATABASE_RESTORE', 'Restored system database from JSON backup file.');
              } else {
                showToast('Invalid backup file structure.', 'error');
              }
            } catch (err) {
              console.error(err);
              showToast('Failed to parse backup JSON file.', 'error');
            }
          };
        }
      };

      if (sessionChecking) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 text-slate-400 text-sm">
            <div className="flex items-center gap-3">
              <i className="fas fa-spinner fa-spin text-indigo-400"></i>
              <span>Restoring your session…</span>
            </div>
          </div>
        );
      }

      if (!currentUser) {
        return <LoginView members={members} onLogin={handleLogin} coopName={coopName} lastSavingsMsg={lastSavingsMsg} />;
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border ${
              toast.type === 'error' 
                ? 'bg-rose-950/90 border-rose-500/50 text-rose-200' 
                : 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200'
            }`}>
              <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle text-rose-400' : 'fa-check-circle text-emerald-400'} text-lg`}></i>
              <span className="font-medium text-sm">{toast.message}</span>
            </div>
          )}

          {/* APP HEADER & NAVIGATION */}
          <header className="bg-slate-950/80 backdrop-blur border-b border-slate-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                {/* Logo & Identity */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/20">
                    <i className="fas fa-building-columns"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-slate-100 text-base leading-tight">{coopName}</h1>
                    <p className="text-xs text-slate-400">Cooperative Management System</p>
                  </div>
                </div>

                {/* Navigation Links */}
                <nav className="hidden md:flex items-center space-x-1">
                  <NavButton 
                    active={activeTab === 'dashboard'} 
                    onClick={() => navigateTab('dashboard')} 
                    icon="fa-chart-pie" 
                    label="Dashboard" 
                  />
                  
                  {(currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'CLERK') && (
                    <NavButton 
                      active={activeTab === 'members'} 
                      onClick={() => navigateTab('members')} 
                      icon="fa-users" 
                      label="Members" 
                    />
                  )}

                  <NavButton 
                    active={activeTab === 'savings'} 
                    onClick={() => navigateTab('savings')} 
                    icon="fa-wallet" 
                    label="Savings & Ledger" 
                  />

                  <NavButton 
                    active={activeTab === 'loans'} 
                    onClick={() => navigateTab('loans')} 
                    icon="fa-hand-holding-dollar" 
                    label="Loans Engine" 
                  />

                  {currentUser.role === 'SUPER_ADMIN' && (
                    <NavButton 
                      active={activeTab === 'reports'} 
                      onClick={() => navigateTab('reports')} 
                      icon="fa-file-invoice-dollar" 
                      label="Reports & Backup" 
                    />
                  )}
                </nav>

                {/* Profile Badge, Settings & Actions */}
                <div className="flex items-center gap-2 sm:gap-3">
                  <div className="text-right hidden sm:block">
                    <div className="text-sm font-semibold text-slate-200">{currentUser.full_name}</div>
                    <div className="flex items-center justify-end gap-1.5">
                      <span className={`inline-block w-2 h-2 rounded-full ${
                        currentUser.role === 'SUPER_ADMIN' ? 'bg-purple-400' :
                        currentUser.role === 'CLERK' ? 'bg-amber-400' : 'bg-emerald-400'
                      }`}></span>
                      <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">{currentUser.role}</span>
                    </div>
                  </div>

                  <button 
                    onClick={() => setIsProfileModalOpen(true)}
                    className="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-700/50"
                    title="Account Settings & Credentials"
                  >
                    <i className="fas fa-user-gear text-sm"></i>
                  </button>

                  <button 
                    onClick={handleLogout}
                    className="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-700/50"
                    title="Log Out"
                  >
                    <i className="fas fa-right-from-bracket text-sm"></i>
                  </button>
                </div>
              </div>

              {/* Mobile Submenu Bar */}
              <div className="md:hidden flex items-center justify-around py-2 border-t border-slate-800 text-xs overflow-x-auto">
                <button onClick={() => navigateTab('dashboard')} className={`px-3 py-1.5 rounded-lg ${activeTab==='dashboard'?'bg-indigo-600/30 text-indigo-400':''}`}>Dashboard</button>
                {(currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'CLERK') && (
                  <button onClick={() => navigateTab('members')} className={`px-3 py-1.5 rounded-lg ${activeTab==='members'?'bg-indigo-600/30 text-indigo-400':''}`}>Members</button>
                )}
                <button onClick={() => navigateTab('savings')} className={`px-3 py-1.5 rounded-lg ${activeTab==='savings'?'bg-indigo-600/30 text-indigo-400':''}`}>Savings</button>
                <button onClick={() => navigateTab('loans')} className={`px-3 py-1.5 rounded-lg ${activeTab==='loans'?'bg-indigo-600/30 text-indigo-400':''}`}>Loans</button>
                {currentUser.role === 'SUPER_ADMIN' && (
                  <button onClick={() => navigateTab('reports')} className={`px-3 py-1.5 rounded-lg ${activeTab==='reports'?'bg-indigo-600/30 text-indigo-400':''}`}>Reports</button>
                )}
              </div>
            </div>
          </header>

          {/* MAIN PAGE CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'dashboard' && (
              <DashboardView 
                currentUser={currentUser}
                members={members}
                savings={recentSavings}
                loans={loans}
                auditLogs={auditLogs}
                setActiveTab={navigateTab}
                setStatementModalMember={setStatementModalMember}
                lastSavingsMsg={lastSavingsMsg}
              />
            )}

            {activeTab === 'members' && (
              <MembersView 
                currentUser={currentUser}
                members={members}
                setMembers={setMembers}
                logAudit={logAudit}
                showToast={showToast}
                setStatementModalMember={setStatementModalMember}
              />
            )}

            {activeTab === 'savings' && (
              <SavingsView 
                currentUser={currentUser}
                members={members}
                setMembers={setMembers}
                logAudit={logAudit}
                showToast={showToast}
                onSavingsChanged={refreshRecentSavings}
              />
            )}

            {activeTab === 'loans' && (
              <LoansView 
                currentUser={currentUser}
                members={members}
                loans={loans}
                setLoans={setLoans}
                logAudit={logAudit}
                showToast={showToast}
                onLoansChanged={refreshLoans}
              />
            )}

            {activeTab === 'reports' && currentUser.role === 'SUPER_ADMIN' && (
              <ReportsView 
                members={members}
                savings={recentSavings}
                loans={loans}
                auditLogs={auditLogs}
                handleImportBackup={handleImportBackup}
                coopName={coopName}
                onSaveCoopName={handleSaveCoopName}
              />
            )}
          </main>

          {/* STATEMENT PRINT MODAL */}
          {statementModalMember && (
            <StatementModal 
              member={statementModalMember}
              loans={loans.filter(l => l.user_id === statementModalMember.id)}
              onClose={() => setStatementModalMember(null)}
              coopName={coopName}
            />
          )}

          {/* PROFILE / CREDENTIAL SETTINGS MODAL */}
          {isProfileModalOpen && (
            <ProfileSettingsModal 
              currentUser={currentUser}
              members={members}
              setMembers={setMembers}
              setCurrentUser={setCurrentUser}
              logAudit={logAudit}
              showToast={showToast}
              onClose={() => setIsProfileModalOpen(false)}
            />
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-slate-950/40 text-slate-500 py-6 text-xs text-center">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>© 2026 {coopName}. High-security financial engine.</div>
              <div className="flex items-center gap-4">
                <span>Status: <span className="text-emerald-400 font-medium">System Online</span></span>
                <span>•</span>
                <span>Version 2.5.0</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

              ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
              : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
          }`}

          <i className={`fas ${icon} text-xs`}></i>
          <span>{label}</span>
        </button>
      );
    }

    // Searchable Combobox (replaces all native <select> dropdowns)
    function Combobox({ value, onChange, options, placeholder = 'Select…', className = '', required = false, size = 'md' }) {
      const [open, setOpen] = useState(false);
      const [query, setQuery] = useState('');
      const containerRef = React.useRef(null);
      const inputRef = React.useRef(null);

      const selected = options.find(o => String(o.value) === String(value));
      const filtered = options.filter(o =>
        (o.label || '').toLowerCase().includes((query || '').toLowerCase())
      );

      // Close on outside click
      useEffect(() => {
        const handler = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setOpen(false);
            setQuery('');
          }
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      // Sync display when value changes externally
      useEffect(() => {
        if (!open) setQuery('');
      }, [value, open]);

      const handleSelect = (opt) => {
        onChange(opt.value);
        setOpen(false);
        setQuery('');
      };

      const inputSize = size === 'sm'
        ? 'px-3 py-1.5 text-xs rounded-lg'
        : 'px-4 py-2.5 text-sm rounded-xl';

      return (
        <div className={`relative ${className}`} ref={containerRef}>
          {/* Hidden input for HTML5 form required validation */}
          {required && (
            <input type="text" value={value || ''} required onChange={() => {}} className="sr-only absolute opacity-0 w-0 h-0" tabIndex={-1} aria-hidden="true" />
          )}
          <div
            className={`w-full bg-slate-900 border border-slate-700 text-slate-100 ${inputSize} flex items-center gap-2 cursor-pointer focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500`}
            onClick={() => {
              setOpen(true);
              setTimeout(() => inputRef.current && inputRef.current.focus(), 10);
            }}
          >
            <input
              ref={inputRef}
              type="text"
              value={open ? query : (selected ? selected.label : '')}
              onChange={e => {
                setQuery(e.target.value);
                if (!open) setOpen(true);
              }}
              onFocus={() => setOpen(true)}
              placeholder={selected ? selected.label : placeholder}
              className="flex-1 bg-transparent outline-none text-slate-100 placeholder-slate-500 min-w-0"
              autoComplete="off"
            />
            <i className={`fas fa-chevron-down text-slate-500 text-[10px] transition-transform ${open ? 'rotate-180' : ''}`}></i>
          </div>

          {open && (
            <div className="absolute z-50 mt-1 w-full max-h-52 overflow-y-auto bg-slate-900 border border-slate-700 rounded-xl shadow-2xl shadow-black/40">
              {filtered.length === 0 ? (
                <div className="px-4 py-3 text-xs text-slate-500">No matches found</div>
              ) : (
                filtered.map(opt => (
                  <button
                    key={String(opt.value)}
                    type="button"
                    onClick={() => handleSelect(opt)}
                    className={`w-full text-left px-4 py-2.5 text-sm transition-colors ${
                      String(opt.value) === String(value)
                        ? 'bg-indigo-600/30 text-indigo-200'
                        : 'text-slate-200 hover:bg-slate-800'
                    }`}
                  >
                    {opt.label}
                  </button>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

          (m.username && m.username.toLowerCase() === cleanUser) ||
          (m.email && m.email.toLowerCase() === cleanUser) ||
          (m.member_number && m.member_number.toLowerCase() === cleanUser)
        );

        if (user && (user.password === passwordInput || (!user.password && passwordInput === 'password123'))) {
          onLogin(user);

      const [fullName, setFullName] = useState(currentUser.full_name || '');
      const [username, setUsername] = useState(currentUser.username || '');
      const [email, setEmail] = useState(currentUser.email || '');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [error, setError] = useState('');

      const handleSave = (e) => {
        e.preventDefault();
        setError('');

        if (!username.trim() || !fullName.trim() || !email.trim()) {
          setError('Please fill out all required fields.');
          return;
        }

        // Check if username is already taken by another user
        const existing = members.find(m => m.id !== currentUser.id && m.username && m.username.toLowerCase() === username.trim().toLowerCase());
        if (existing) {
          setError('Username is already taken by another user.');
          return;
        }

        if (newPassword && newPassword !== confirmPassword) {
          setError('New passwords do not match.');
          return;
        }

        const updatedUser = {
          ...currentUser,
          full_name: fullName.trim(),
          username: username.trim(),
          email: email.trim(),
          password: newPassword ? newPassword : (currentUser.password || 'password123')
        };

        setMembers(prev => prev.map(m => m.id === currentUser.id ? updatedUser : m));
        setCurrentUser(updatedUser);

    function MembersView({ currentUser, members, setMembers, logAudit, showToast, setStatementModalMember }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newMember, setNewMember] = useState({ full_name: '', username: '', email: '', phone: '', role: 'MEMBER', password: 'password123' });
      const [editingMember, setEditingMember] = useState(null);
      const [deletingMember, setDeletingMember] = useState(null);
      // Undo / Redo stacks (admin) — snapshots of members array
      const [membersUndoStack, setMembersUndoStack] = useState([]);
      const [membersRedoStack, setMembersRedoStack] = useState([]);
      const canAdminHistory = currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'CLERK';

      const pushMembersHistory = () => {
        if (!canAdminHistory) return;
        setMembersUndoStack(prev => [...prev.slice(-29), JSON.parse(JSON.stringify(members))]);
        setMembersRedoStack([]);
      };

      const handleMembersUndo = () => {
        if (!canAdminHistory || membersUndoStack.length === 0) return;
        const previous = membersUndoStack[membersUndoStack.length - 1];
        setMembersUndoStack(prev => prev.slice(0, -1));
        setMembersRedoStack(prev => [...prev, JSON.parse(JSON.stringify(members))]);
        setMembers(previous);
        logAudit('UNDO_MEMBERS', 'Undid last member directory change.');
        showToast('Undid last member change.');
      };

      const handleMembersRedo = () => {
        if (!canAdminHistory || membersRedoStack.length === 0) return;
        const next = membersRedoStack[membersRedoStack.length - 1];
        setMembersRedoStack(prev => prev.slice(0, -1));
        setMembersUndoStack(prev => [...prev, JSON.parse(JSON.stringify(members))]);
        setMembers(next);
        logAudit('REDO_MEMBERS', 'Redid member directory change.');
        showToast('Redid member change.');
      };

      const filteredMembers = members.filter(m => 
        m.full_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        m.member_number.toLowerCase().includes(searchTerm.toLowerCase()) ||
        (m.username && m.username.toLowerCase().includes(searchTerm.toLowerCase())) ||
        m.email.toLowerCase().includes(searchTerm.toLowerCase())
      );

      // Export Members to CSV
      const handleExportMembersCSV = () => {
        const headers = ["Member ID", "Member Number", "Full Name", "Username", "Email", "Phone", "Role", "Status", "Savings (₦)", "Joined Date"];
        const rows = members.map(m => [
          m.id, m.member_number, m.full_name, m.username || '', m.email, m.phone, m.role, m.status, m.savings, m.joined
        ]);
        downloadCSV(`Coop_Members_Directory_${new Date().toISOString().substring(0,10)}.csv`, headers, rows);
        showToast('Member directory exported as CSV!');
      };

      const handleAddMember = (e) => {
        e.preventDefault();
        if (currentUser.role !== 'SUPER_ADMIN') {
          showToast('Only Super Admin can register new members.', 'error');
          return;
        }
        const created = {
          id: `usr-${Date.now()}`,
          member_number: `COP-2026-00${members.length + 1}`,
          full_name: newMember.full_name,
          username: newMember.username.trim() || newMember.email.split('@')[0],
          password: newMember.password || 'password123',
          email: newMember.email,
          phone: newMember.phone,
          role: newMember.role,
          status: 'ACTIVE',
          savings: 0,
          joined: new Date().toISOString().substring(0, 10)
        };
        pushMembersHistory();
        setMembers(prev => [created, ...prev]);
        logAudit('ADD_MEMBER', `Created new member account: ${created.full_name} (${created.member_number})`);
        showToast(`Member ${created.full_name} registered successfully!`);
        setIsModalOpen(false);
        setNewMember({ full_name: '', username: '', email: '', phone: '', role: 'MEMBER', password: 'password123' });
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        if (!editingMember) return;

        // Ensure unique username
        const existing = members.find(m => m.id !== editingMember.id && m.username && m.username.toLowerCase() === editingMember.username.trim().toLowerCase());
        if (existing) {
          showToast('Username is already taken by another member.', 'error');
          return;
        }

        pushMembersHistory();
        setMembers(prev => prev.map(m => m.id === editingMember.id ? editingMember : m));
        logAudit('EDIT_MEMBER', `Updated member profile for ${editingMember.full_name} (${editingMember.member_number})`);
        showToast(`Member profile for ${editingMember.full_name} saved!`);
        setEditingMember(null);
      };

      const handleConfirmDelete = () => {
        if (!deletingMember) return;

        if (deletingMember.id === currentUser.id) {
          showToast('You cannot delete your own currently logged-in account!', 'error');
          setDeletingMember(null);
          return;
        }

        pushMembersHistory();
        setMembers(prev => prev.filter(m => m.id !== deletingMember.id));
        logAudit('DELETE_MEMBER', `Deleted member account ${deletingMember.full_name} (${deletingMember.member_number})`);
        showToast(`Member account for ${deletingMember.full_name} permanently removed.`, 'error');
        setDeletingMember(null);
      };

            </div>

            <div className="flex items-center gap-3 flex-wrap">
              {canAdminHistory && (
                <>
                  <button
                    type="button"
                    onClick={handleMembersUndo}
                    disabled={membersUndoStack.length === 0}
                    className="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 border border-slate-700 text-sm font-medium transition-all flex items-center gap-2"
                    title="Undo last member change"

                    <i className="fas fa-rotate-left text-amber-400"></i>
                    <span>Undo</span>
                  </button>
                  <button
                    type="button"
                    onClick={handleMembersRedo}
                    disabled={membersRedoStack.length === 0}
                    className="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 border border-slate-700 text-sm font-medium transition-all flex items-center gap-2"
                    title="Redo member change"

                    <i className="fas fa-rotate-right text-indigo-400"></i>
                    <span>Redo</span>

              <button

              >
                <i className="fas fa-download text-emerald-400"></i>
                <span>Export Roster CSV</span>
              </button>

              {currentUser.role === 'SUPER_ADMIN' && (
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition-all shadow-lg shadow-indigo-600/30 flex items-center gap-2"
                >
                  <i className="fas fa-user-plus"></i>
                  <span>Add New Member</span>
                </button>
              )}
            </div>
          </div>

          {/* Search Bar */}
          <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-4">
            <div className="relative">
              <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
              <input

                placeholder="Search member by name, username, ID number or email..."

    function SavingsView({ currentUser, members, setMembers, logAudit, showToast, onSavingsChanged }) {
      const isMember = currentUser.role === 'MEMBER';
      const isAdmin = currentUser.role === 'SUPER_ADMIN';
      const canAdminHistory = currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'CLERK';
      const [filterUserId, setFilterUserId] = useState(isMember ? currentUser.id : 'ALL');
      const [ledgerRows, setLedgerRows] = useState([]);
      const [loadingLedger, setLoadingLedger] = useState(false);
      const [page, setPage] = useState(0);
      const [deletingTx, setDeletingTx] = useState(null);
      // Undo / Redo for savings actions: { type: 'ADD'|'DELETE', record }
      const [savUndoStack, setSavUndoStack] = useState([]);
      const [savRedoStack, setSavRedoStack] = useState([]);

      // Form State
      const [selectedMemberId, setSelectedMemberId] = useState(members[0]?.id || '');
      const [amount, setAmount] = useState('');
      const [transType, setTransType] = useState('DEPOSIT');

      const applyBalanceDelta = (userId, transactionType, amount, reverse = false) => {
        const amt = Number(amount) || 0;
        let delta = transactionType === 'DEPOSIT' ? amt : -amt;
        if (reverse) delta = -delta;
        setMembers(prev => prev.map(m => {
          if (m.id !== userId) return m;
          return { ...m, savings: Math.max(0, (m.savings || 0) + delta) };
        }));
      };

      const pushSavHistory = (entry) => {
        if (!canAdminHistory) return;
        setSavUndoStack(prev => [...prev.slice(-29), entry]);
        setSavRedoStack([]);
      };

      const handleSavUndo = async () => {
        if (!canAdminHistory || savUndoStack.length === 0) return;
        const entry = savUndoStack[savUndoStack.length - 1];
        setSavUndoStack(prev => prev.slice(0, -1));
        try {
          if (entry.type === 'ADD') {
            await deleteSavingsTx(entry.record);
            applyBalanceDelta(entry.record.user_id, entry.record.transaction_type, entry.record.amount, true);
          } else if (entry.type === 'DELETE') {
            await writeSavingsTx(entry.record);
            applyBalanceDelta(entry.record.user_id, entry.record.transaction_type, entry.record.amount, false);
          }
          setSavRedoStack(prev => [...prev, entry]);
          await reloadLedger(filterUserId);
          if (onSavingsChanged) onSavingsChanged();
          logAudit('UNDO_SAVINGS', `Undid savings ${entry.type} for ${entry.record.reference_no}`);
          showToast('Undid last savings change.');
        } catch (err) {
          console.error(err);
          showToast('Failed to undo savings change.', 'error');
        }
      };

      const handleSavRedo = async () => {
        if (!canAdminHistory || savRedoStack.length === 0) return;
        const entry = savRedoStack[savRedoStack.length - 1];
        setSavRedoStack(prev => prev.slice(0, -1));
        try {
          if (entry.type === 'ADD') {
            await writeSavingsTx(entry.record);
            applyBalanceDelta(entry.record.user_id, entry.record.transaction_type, entry.record.amount, false);
          } else if (entry.type === 'DELETE') {
            await deleteSavingsTx(entry.record);
            applyBalanceDelta(entry.record.user_id, entry.record.transaction_type, entry.record.amount, true);
          }
          setSavUndoStack(prev => [...prev, entry]);
          await reloadLedger(filterUserId);
          if (onSavingsChanged) onSavingsChanged();
          logAudit('REDO_SAVINGS', `Redid savings ${entry.type} for ${entry.record.reference_no}`);
          showToast('Redid savings change.');
        } catch (err) {
          console.error(err);
          showToast('Failed to redo savings change.', 'error');
        }
      };

      // Phase 2–3: load only selected member (or ALL with UI pagination)
      const reloadLedger = async (uid) => {
        setLoadingLedger(true);
        try {
          const rows = await loadSavingsForMember(uid);
          setLedgerRows(rows);
          setPage(0);
        } catch (err) {
          console.error(err);
          showToast('Failed to load savings ledger.', 'error');
        } finally {
          setLoadingLedger(false);
        }
      };

      useEffect(() => {
        reloadLedger(filterUserId);
      }, [filterUserId]);

      const totalPages = Math.max(1, Math.ceil(ledgerRows.length / PAGE_SIZE));
      const pageRows = ledgerRows.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

      // Export Ledger CSV (current loaded set only)
      const handleDownloadLedgerCSV = () => {
        const headers = ["Tx ID", "Date", "Member Name", "Type", "Amount (₦)", "Reference No", "Recorded By"];
        const rows = ledgerRows.map(s => [
          s.id, s.date, s.member_name, s.transaction_type, s.amount, s.reference_no, s.recorded_by
        ]);
        downloadCSV(`Savings_Ledger_Export_${new Date().toISOString().substring(0,10)}.csv`, headers, rows);
        showToast('Savings ledger exported successfully!');
      };

      // Record Deposit/Withdrawal — per-record Firebase write
      const handleRecordTransaction = async (e) => {
        e.preventDefault();
        const targetMember = members.find(m => m.id === selectedMemberId);
        if (!targetMember) return;

        const numAmount = parseFloat(amount);
        if (isNaN(numAmount) || numAmount <= 0) {
          showToast('Please enter a valid positive amount.', 'error');
          return;
        }

        if (transType === 'WITHDRAWAL' && targetMember.savings < numAmount) {
          showToast('Insufficient savings balance for withdrawal!', 'error');
          return;
        }

        const newRecord = {
          id: `sav-${Date.now()}`,
          user_id: targetMember.id,
          member_name: targetMember.full_name,
          amount: numAmount,
          transaction_type: transType,
          recorded_by: currentUser.full_name,
          reference_no: `${transType === 'DEPOSIT' ? 'DEP' : 'WTH'}-${Math.floor(1000 + Math.random() * 9000)}`,
          date: new Date().toISOString().substring(0, 10)
        };

        try {
          await writeSavingsTx(newRecord);
          pushSavHistory({ type: 'ADD', record: { ...newRecord } });
          setMembers(prev => prev.map(m => {
            if (m.id === targetMember.id) {
              const newBal = transType === 'DEPOSIT' ? m.savings + numAmount : m.savings - numAmount;
              return { ...m, savings: newBal };
            }
            return m;
          }));
          await reloadLedger(filterUserId);
          if (onSavingsChanged) onSavingsChanged();
          logAudit('RECORD_SAVINGS', `Recorded ${transType} of ₦${numAmount} for ${targetMember.full_name} (${newRecord.reference_no})`);
          showToast(`Transaction ${newRecord.reference_no} saved!`);
          setAmount('');
        } catch (err) {
          console.error(err);
          showToast('Failed to save transaction to database.', 'error');
        }
      };

      // SUPER_ADMIN only: permanently delete a pre-saved savings transaction and reverse balance
      const handleConfirmDeleteSavings = async () => {
        if (!deletingTx || currentUser.role !== 'SUPER_ADMIN') {
          showToast('Only Super Admin can delete savings records.', 'error');
          setDeletingTx(null);
          return;
        }
        try {
          const snapshot = { ...deletingTx };
          await deleteSavingsTx(deletingTx);
          pushSavHistory({ type: 'DELETE', record: snapshot });
          // Reverse the effect on member balance
          setMembers(prev => prev.map(m => {
            if (m.id !== deletingTx.user_id) return m;
            const delta = deletingTx.transaction_type === 'DEPOSIT'
              ? -Number(deletingTx.amount)
              : Number(deletingTx.amount);
            return { ...m, savings: Math.max(0, (m.savings || 0) + delta) };
          }));
          await reloadLedger(filterUserId);
          if (onSavingsChanged) onSavingsChanged();
          logAudit('DELETE_SAVINGS', `Deleted savings ${deletingTx.transaction_type} ${deletingTx.reference_no} of ₦${deletingTx.amount} for ${deletingTx.member_name}`);
          showToast(`Savings record ${deletingTx.reference_no} permanently deleted.`, 'error');
          setDeletingTx(null);
        } catch (err) {
          console.error(err);
          showToast('Failed to delete savings record.', 'error');
        }
      };

      // Simulated Bulk Payroll Upload — per-member writes
      const handleSimulateBulkPayroll = async () => {
        let totalProcessed = 0;
        try {
          const updatedMembers = [];
          for (const m of members) {
            const monthlyAmount = 250;
            totalProcessed += monthlyAmount;
            const rec = {
              id: `sav-bulk-${Date.now()}-${m.id}`,
              user_id: m.id,
              member_name: m.full_name,
              amount: monthlyAmount,
              transaction_type: 'DEPOSIT',
              recorded_by: `${currentUser.full_name} (Bulk CSV)`,
              reference_no: `PAYROLL-${Math.floor(1000 + Math.random() * 9000)}`,
              date: new Date().toISOString().substring(0, 10)
            };
            await writeSavingsTx(rec);
            updatedMembers.push({ ...m, savings: m.savings + monthlyAmount });
          }
          setMembers(updatedMembers);
          await reloadLedger(filterUserId);
          if (onSavingsChanged) onSavingsChanged();
          logAudit('BULK_PAYROLL_UPLOAD', `Processed automated monthly payroll deduction of ₦${totalProcessed} across ${members.length} members.`);
          showToast(`Bulk Payroll processed! ₦${totalProcessed} added.`);

      return (

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            {/* Record Entry Form (Admin/Clerk view) */}

            {/* Savings Ledger Table */}
            <div className={`${!isMember ? 'lg:col-span-2' : 'lg:col-span-3'} bg-slate-800/40 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4`}>
              
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">

                    <Combobox

                  {ledgerRows.length} record{ledgerRows.length === 1 ? '' : 's'}

                {totalPages > 1 && (

    function LoansView({ currentUser, members, loans, setLoans, logAudit, showToast, onLoansChanged }) {
      const isMember = currentUser.role === 'MEMBER';
      const isClerk = currentUser.role === 'CLERK';
      const isAdmin = currentUser.role === 'SUPER_ADMIN';

      // Loan Application Form State
      const [showApplyForm, setShowApplyForm] = useState(false);
      const [principal, setPrincipal] = useState('');
      const [tenure, setTenure] = useState(6);
      const [guarantor1, setGuarantor1] = useState('');
      const [guarantor2, setGuarantor2] = useState('');
      const [loanPage, setLoanPage] = useState(0);

      // Repayment form state (Admin/Clerk)
      const [repayLoanId, setRepayLoanId] = useState(null);
      const [repayAmount, setRepayAmount] = useState('');
      const [repayNote, setRepayNote] = useState('');
      // Collapsed by default — track which loan cards are expanded
      const [expandedLoans, setExpandedLoans] = useState({});
      // Undo / Redo: entries { before: loan|null, after: loan } — before null means newly created
      const [loanUndoStack, setLoanUndoStack] = useState([]);
      const [loanRedoStack, setLoanRedoStack] = useState([]);
      const canAdminHistory = currentUser.role === 'SUPER_ADMIN' || currentUser.role === 'CLERK';

      const toggleLoanExpand = (loanId) => {
        setExpandedLoans(prev => ({ ...prev, [loanId]: !prev[loanId] }));
      };

      const pushLoanHistory = (before, after) => {
        if (!canAdminHistory) return;
        setLoanUndoStack(prev => [...prev.slice(-29), {
          before: before ? JSON.parse(JSON.stringify(before)) : null,
          after: after ? JSON.parse(JSON.stringify(after)) : null
        }]);
        setLoanRedoStack([]);
      };

      const handleLoanUndo = async () => {
        if (!canAdminHistory || loanUndoStack.length === 0) return;
        const entry = loanUndoStack[loanUndoStack.length - 1];
        setLoanUndoStack(prev => prev.slice(0, -1));
        try {
          if (entry.before === null && entry.after) {
            // Was a new loan application — remove it
            await db.ref(`loans/${entry.after.id}`).remove();
            setLoans(prev => prev.filter(l => l.id !== entry.after.id));
          } else if (entry.before) {
            const restored = await writeLoan(entry.before);
            setLoans(prev => prev.map(l => l.id === restored.id ? restored : l));
          }
          setLoanRedoStack(prev => [...prev, entry]);
          if (onLoansChanged) onLoansChanged();
          logAudit('UNDO_LOAN', 'Undid last loan pipeline change.');
          showToast('Undid last loan change.');
        } catch (err) {
          console.error(err);
          showToast('Failed to undo loan change.', 'error');
        }
      };

      const handleLoanRedo = async () => {
        if (!canAdminHistory || loanRedoStack.length === 0) return;
        const entry = loanRedoStack[loanRedoStack.length - 1];
        setLoanRedoStack(prev => prev.slice(0, -1));
        try {
          if (entry.before === null && entry.after) {
            const saved = await writeLoan(entry.after);
            setLoans(prev => [saved, ...prev.filter(l => l.id !== saved.id)]);
          } else if (entry.after) {
            const saved = await writeLoan(entry.after);
            setLoans(prev => prev.map(l => l.id === saved.id ? saved : l));
          }
          setLoanUndoStack(prev => [...prev, entry]);
          if (onLoansChanged) onLoansChanged();
          logAudit('REDO_LOAN', 'Redid loan pipeline change.');
          showToast('Redid loan change.');
        } catch (err) {
          console.error(err);
          showToast('Failed to redo loan change.', 'error');
        }
      };

      // Helper: total amount due on a loan (principal + flat interest)
      const getTotalDue = (loan) => {
        return loan.principal_amount * (1 + (loan.interest_rate || 5) / 100);
      };

      // Helper: total already repaid
      const getTotalRepaid = (loan) => {
        if (!loan.repayments || !Array.isArray(loan.repayments)) return 0;
        return loan.repayments.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
      };

      // Helper: remaining balance
      const getRemaining = (loan) => {
        return Math.max(0, getTotalDue(loan) - getTotalRepaid(loan));
      };

      // Approximate next repayment date (last repayment or created_at + 30 days), as DD/MM/YY
      const getNextRepaymentDate = (loan) => {
        if (loan.status === 'FULLY_PAID') return 'Paid off';
        if (loan.status !== 'APPROVED') return 'Pending';
        const repayments = loan.repayments || [];
        let baseDate = loan.created_at;
        if (repayments.length > 0) {
          const sorted = [...repayments].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          baseDate = sorted[0].date || baseDate;
        }
        if (!baseDate) return '—';
        const d = new Date(baseDate);
        if (isNaN(d.getTime())) return '—';
        d.setDate(d.getDate() + 30);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yy = String(d.getFullYear()).slice(-2);
        return `${dd}/${mm}/${yy}`;
      };

      // Loan status badge meta (label, colors, icon)
      const getLoanStatusMeta = (status) => {
        switch (status) {
          case 'FULLY_PAID':
            return {
              label: 'FULLY PAID',
              icon: 'fa-circle-check',
              className: 'bg-emerald-500/25 text-emerald-300 border-emerald-400/50'
            };
          case 'APPROVED':
            return {
              label: 'APPROVED',
              icon: 'fa-check-double',
              className: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/40'
            };
          case 'VERIFIED_BY_CLERK':
            return {
              label: 'VERIFIED',
              icon: 'fa-clipboard-check',
              className: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40'
            };
          case 'PENDING_GUARANTORS':
            return {
              label: 'AWAITING GUARANTORS',
              icon: 'fa-user-clock',
              className: 'bg-amber-500/20 text-amber-300 border-amber-500/40'
            };
          case 'REJECTED':
            return {
              label: 'REJECTED',
              icon: 'fa-circle-xmark',
              className: 'bg-rose-500/20 text-rose-300 border-rose-500/40'
            };
          default:
            return {
              label: (status || 'PENDING').replace(/_/g, ' '),
              icon: 'fa-clock',
              className: 'bg-amber-500/15 text-amber-300 border-amber-500/30'
            };
        }
      };

      const renderLoanStatusBadge = (status, size = 'sm') => {
        const meta = getLoanStatusMeta(status);
        const sizeCls = size === 'lg'
          ? 'px-3 py-1 text-xs gap-1.5'
          : 'px-2.5 py-0.5 text-[10px] gap-1';
        return (
          <span className={`inline-flex items-center rounded-full font-bold border ${sizeCls} ${meta.className}`}>
            <i className={`fas ${meta.icon}`}></i>
            <span>{meta.label}</span>
          </span>
        );
      };

      // Export Loan Schedule
      const handleDownloadLoanSchedule = (loan) => {
        const headers = ["Payment Month", "Principal Portion", "Interest Portion (5%)", "Total Monthly Due (₦)"];
        const rows = [];
        const monthlyPrincipal = loan.principal_amount / loan.tenure_months;
        const monthlyInterest = (loan.principal_amount * 0.05) / loan.tenure_months;

        for (let i = 1; i <= loan.tenure_months; i++) {
          rows.push([
            `Month ${i}`,
            monthlyPrincipal.toFixed(2),
            monthlyInterest.toFixed(2),
            loan.monthly_repayment.toFixed(2)
          ]);
        }

        downloadCSV(`Loan_Repayment_Schedule_${loan.id}.csv`, headers, rows);
        showToast(`Downloaded amortization schedule for Loan #${loan.id}`);
      };

      // Submit Loan Request
      const handleApplyLoan = async (e) => {
        e.preventDefault();
        const principalNum = parseFloat(principal);
        if (isNaN(principalNum) || principalNum <= 0) {
          showToast('Please enter a valid loan principal amount.', 'error');
          return;
        }

        if (!guarantor1 || !guarantor2 || guarantor1 === guarantor2) {
          showToast('Please select two distinct member guarantors.', 'error');
          return;
        }

        const g1Obj = members.find(m => m.id === guarantor1);
        const g2Obj = members.find(m => m.id === guarantor2);

        // Interest Rate Flat 5% calculation
        const totalInterest = principalNum * 0.05;
        const totalRepay = principalNum + totalInterest;
        const monthlyDue = totalRepay / tenure;

        const newLoan = {
          id: `ln-${Date.now().toString().slice(-6)}`,
          user_id: currentUser.id,
          member_name: currentUser.full_name,
          principal_amount: principalNum,
          interest_rate: 5,
          tenure_months: parseInt(tenure),
          monthly_repayment: monthlyDue,
          status: 'PENDING_GUARANTORS',
          approved_by: null,
          created_at: new Date().toISOString().substring(0, 10),
          repayments: [],
          guarantors: [
            { user_id: g1Obj.id, name: g1Obj.full_name, status: 'PENDING' },
            { user_id: g2Obj.id, name: g2Obj.full_name, status: 'PENDING' }
          ]
        };

        try {
          const saved = await writeLoan(newLoan);
          pushLoanHistory(null, saved);
          setLoans(prev => [saved, ...prev.filter(l => l.id !== saved.id)]);
          if (onLoansChanged) onLoansChanged();
          logAudit('APPLY_LOAN', `Submitted loan request #${saved.id} for ₦${principalNum}`);
          showToast('Loan application submitted! Awaiting guarantor endorsement.');
          setPrincipal('');
          setGuarantor1('');
          setGuarantor2('');
          setShowApplyForm(false);
        } catch (err) {
          console.error(err);
          showToast('Failed to submit loan application.', 'error');
        }
      };

      // Guarantor Endorse
      const handleEndorseGuarantor = async (loanId) => {
        const loan = loans.find(l => l.id === loanId);
        if (!loan) return;
        const updatedG = (loan.guarantors || []).map(g => g.user_id === currentUser.id ? { ...g, status: 'ACCEPTED' } : g);
        const allAccepted = updatedG.every(g => g.status === 'ACCEPTED');
        const updated = {
          ...loan,
          guarantors: updatedG,
          status: allAccepted ? 'VERIFIED_BY_CLERK' : loan.status
        };
        try {
          await writeLoan(updated);
          pushLoanHistory(loan, updated);
          setLoans(prev => prev.map(l => l.id === loanId ? updated : l));
          if (onLoansChanged) onLoansChanged();
          logAudit('GUARANTOR_ENDORSE', `Guarantor ${currentUser.full_name} accepted request for loan #${loanId}`);
          showToast('Guarantor endorsement signed!');
        } catch (err) {
          console.error(err);
          showToast('Failed to save endorsement.', 'error');
        }
      };

      // Admin Approve & Disburse
      const handleApproveLoan = async (loanId) => {
        const loan = loans.find(l => l.id === loanId);
        if (!loan) return;
        const updated = { ...loan, status: 'APPROVED', approved_by: currentUser.full_name, repayments: loan.repayments || [] };
        try {
          await writeLoan(updated);
          pushLoanHistory(loan, updated);
          setLoans(prev => prev.map(l => l.id === loanId ? updated : l));
          if (onLoansChanged) onLoansChanged();
          logAudit('APPROVE_LOAN', `Super Admin ${currentUser.full_name} disbursed loan #${loanId}`);
          showToast('Loan approved and capital disbursed successfully!');
        } catch (err) {
          console.error(err);
          showToast('Failed to approve loan.', 'error');
        }
      };

      // Record a loan repayment (Admin / Clerk)
      const handleRecordRepayment = async (e) => {
        e.preventDefault();
        const amountNum = parseFloat(repayAmount);
        if (!repayLoanId || isNaN(amountNum) || amountNum <= 0) {
          showToast('Please enter a valid positive repayment amount.', 'error');
          return;
        }

        const targetLoan = loans.find(l => l.id === repayLoanId);
        if (!targetLoan) return;

        const remaining = getRemaining(targetLoan);
        if (amountNum > remaining + 0.01) {
          showToast(`Amount exceeds remaining balance of ${formatMoney(remaining)}.`, 'error');
          return;
        }

        const newRepayment = {
          id: `rep-${Date.now()}`,
          amount: amountNum,
          date: new Date().toISOString().substring(0, 10),
          recorded_by: currentUser.full_name,
          reference_no: `REP-${Math.floor(1000 + Math.random() * 9000)}`,
          note: repayNote.trim() || 'Monthly installment'
        };

        const updatedRepayments = [...(targetLoan.repayments || []), newRepayment];
        const newTotalRepaid = updatedRepayments.reduce((s, r) => s + (Number(r.amount) || 0), 0);
        const totalDue = getTotalDue(targetLoan);
        const isFullyPaid = newTotalRepaid >= totalDue - 0.01;
        const updated = {
          ...targetLoan,
          repayments: updatedRepayments,
          status: isFullyPaid ? 'FULLY_PAID' : targetLoan.status
        };

        try {
          await writeLoan(updated);
          pushLoanHistory(targetLoan, updated);
          setLoans(prev => prev.map(l => l.id === repayLoanId ? updated : l));
          if (onLoansChanged) onLoansChanged();
          logAudit('LOAN_REPAYMENT', `Recorded repayment of ₦${amountNum} for loan #${repayLoanId} (${newRepayment.reference_no})`);
          showToast(`Repayment ${newRepayment.reference_no} recorded successfully!`);
          setRepayLoanId(null);
          setRepayAmount('');
          setRepayNote('');
        } catch (err) {
          console.error(err);
          showToast('Failed to record repayment.', 'error');
        }
      };

      return (

                  title="Redo loan change"

                  <i className="fas fa-rotate-right text-indigo-400"></i>
                  <span>Redo</span>
                </button>

                <i className="fas fa-hand-holding-dollar"></i>
                <span>Apply for Member Loan</span>
              </button>

                  <i className="fas fa-hand-holding-dollar text-emerald-400"></i>
                  <span>Apply for Member Loan</span>
                </h3>
                <button
                  type="button"
                  onClick={() => setShowApplyForm(false)}
                  className="text-slate-400 hover:text-white p-1"
                  title="Close"
                >
                  <i className="fas fa-xmark text-lg"></i>
                </button>
              </div>

              <form onSubmit={handleApplyLoan} className="space-y-4">

                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Principal Amount (₦)</label>

                  >
                    Submit Application

                  <button
                    type="button"

                    className="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium"

                    Cancel

              </form>

                              <div className="text-[11px] text-slate-500 mt-0.5">Applied: {loan.created_at}</div>

                              <span className="font-bold text-slate-100">{formatMoney(loan.principal_amount)}</span>
